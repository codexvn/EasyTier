name: QUIC branch build

on:
  push:
    branches: ["fix/quic-multi-interface"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quic-branch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            features: mimalloc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: linux-x86_64
            features: jemalloc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.target }}
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quic-branch-${{ matrix.target }}
      - name: Build core and CLI
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          --package easytier --bin easytier-core --bin easytier-cli
          --features ${{ matrix.features }}
      - name: Prepare artifacts
        run: |
          mkdir artifacts
          if [[ '${{ runner.os }}' == 'Windows' ]]; then
            cp target/${{ matrix.target }}/release/easytier-{core,cli}.exe artifacts/
            cp easytier/third_party/x86_64/{Packet.dll,wintun.dll,WinDivert64.sys} artifacts/
          else
            cp target/${{ matrix.target }}/release/easytier-{core,cli} artifacts/
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: easytier-quic-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
